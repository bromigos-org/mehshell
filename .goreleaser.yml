version: 2

builds:
  - binary: mehshell
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "mehshell_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSE-UNICODE
      - README.md

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: bromigos-org
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    homepage: https://bromigos.org
    description: "Fast, parallelized zsh prompt engine written in Go"
    license: MIT
    install: |
      bin.install "mehshell"
      doc.install "LICENSE", "LICENSE-UNICODE", "README.md"

changelog:
  sort: asc
