name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Check tap token access without printing it
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/bromigos-org/homebrew-tap --jq '.permissions.push' | grep -qx true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether AUR publishing is configured
        id: configured
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Pin the source release
        if: steps.configured.outputs.ready == 'true'
        run: |
          version=${GITHUB_REF_NAME#v}
          curl -fL "https://github.com/bromigos-org/mehshell/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" -o /tmp/source.tar.gz
          checksum=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^sha256sums=.*/sha256sums=('$checksum')/" aur/PKGBUILD
      - name: Build and test before publishing
        if: steps.configured.outputs.ready == 'true'
        run: |
          docker run --rm -v "$PWD/aur:/package" archlinux:base-devel bash -ec '
            pacman -Syu --noconfirm --needed go git zsh >/dev/null
            useradd -m builder
            chown -R builder:builder /package
            su builder -c "cd /package && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          '
      - name: Publish to AUR
        if: steps.configured.outputs.ready == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: mehshell
          pkgbuild: aur/PKGBUILD
          commit_username: blackflame
          commit_email: packages@bromigos.org
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
