name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether AUR publishing is configured
        id: configured
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Update the package from release checksums
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir /tmp
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" aur/PKGBUILD
          for pair in 'x86_64 amd64' 'aarch64 arm64'; do
            set -- $pair
            checksum=$(awk -v file="mehshell_linux_$2.tar.gz" '$2 == file {print $1}' /tmp/checksums.txt)
            test -n "$checksum"
            sed -i "s/^sha256sums_$1=.*/sha256sums_$1=('$checksum')/" aur/PKGBUILD
          done
      - name: Publish to AUR
        if: steps.configured.outputs.ready == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: mehshell-bin
          pkgbuild: aur/PKGBUILD
          commit_username: bromigOS
          commit_email: packages@bromigos.org
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
